name: Build & Release

# Jalan pas tag versi (v0.2.0, dst) di-push, ATAU manual lewat tab Actions ("Run workflow").
# Build Windows DAN macOS sekaligus (paralel, matrix) — macOS gak bisa di-build dari mesin
# Windows lokal, jadi ini satu-satunya jalur buat dapetin installer Mac.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

# Wajib buat electron-builder bisa upload installer ke GitHub Release pakai GITHUB_TOKEN bawaan
# Actions (gak perlu bikin PAT terpisah lagi buat ini).
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    env:
      SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
      SLACK_REDIRECT_URI: ${{ secrets.SLACK_REDIRECT_URI }}
      OAUTH_PORT: ${{ secrets.OAUTH_PORT }}
      GITHUB_REPO: ${{ secrets.RELEASE_REPO }}
      GITHUB_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      # typecheck + 24 test regresi + smoke test Electron sungguhan + build renderer — pipeline
      # verifikasi yang sama kayak dipakai lokal (npm run check), gagal di sini = gak lanjut publish.
      - run: npm run check
      # --publish always: bikin/update GitHub Release buat tag ini, upload installer sebagai asset.
      # Kalau ini bukan tag push (workflow_dispatch manual), electron-builder tetap build tapi
      # publish-nya di-skip otomatis (gak ada tag versi buat dikaitkan).
      - name: Build & publish
        run: npx electron-builder --${{ matrix.target }} --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
      # Simpen juga sebagai artifact run — biar bisa didownload dari tab Actions walau BUKAN
      # dari tag push (misal lagi tes workflow_dispatch manual, belum mau bikin Release beneran).
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: installer-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: ignore
