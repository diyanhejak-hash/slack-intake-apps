name: Build & Release

# Jalan pas tag versi (v0.2.0, dst) di-push, ATAU manual lewat tab Actions ("Run workflow").
# Build Windows dan macOS sekaligus (paralel, matrix). Build Linux dinonaktifkan sementara.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

# Wajib buat job "release" bisa bikin GitHub Release + upload asset pakai GITHUB_TOKEN bawaan
# Actions (gak perlu bikin PAT terpisah lagi buat ini).
permissions:
  contents: write

jobs:
  # Cuma BUILD di sini (publish: never) -- release-nya sengaja dipisah ke job "release" di bawah
  # yang jalan SEKALI setelah SEMUA platform kelar. Sebelumnya tiap platform publish sendiri-
  # sendiri (paralel) -- electron-builder bikin/pakai GitHub Release "draft" per tag, dan karena
  # 2+ job jalan BARENGAN, masing-masing bisa gagal nemuin draft punya job LAIN (belum sempat
  # ke-buat pas dicek) terus bikin draft DUPLIKAT sendiri-sendiri buat tag yang sama -- installer
  # ke-split ke beberapa release "v0.3.2" yang berbeda, bikin bingung. Build-only + 1 job release
  # terpisah menghindari race ini total.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    env:
      SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
      SLACK_REDIRECT_URI: ${{ secrets.SLACK_REDIRECT_URI }}
      GITHUB_REPO: ${{ secrets.RELEASE_REPO }}
      GITHUB_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      # typecheck + test regresi + smoke test Electron sungguhan + build renderer -- pipeline
      # verifikasi yang sama kayak dipakai lokal (npm run check), gagal di sini = gak lanjut build.
      - name: Run checks
        run: npm run check
      - name: Build installer (publish belakangan, lihat job "release")
        run: npx electron-builder --${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          path: |
            release/*.exe
            release/*.dmg
          if-no-files-found: ignore

  # Jalan SEKALI hanya kalau SEMUA build/check platform sukses. Rilis resmi tidak boleh terbit
  # parsial karena satu platform yang gagal bisa menandakan regresi lintas-platform.
  # Cuma jalan pas tag push -- workflow_dispatch manual TETAP cuma nyimpen artifact biasa (tab
  # Actions), gak bikin Release beneran, biar gak numpuk Release buat percobaan/tes.
  release:
    needs: build
    if: ${{ success() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: installer-*
          merge-multiple: true
      - name: Publish GitHub Release (1 release, semua installer platform yang sukses jadi asset)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" release/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
